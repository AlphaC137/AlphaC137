    <style>
      .marquee-rail {
        stroke-dasharray: 6, 4;
        animation: dash 20s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      .beacon-glow {
        animation: blink 2s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 0.2; r: 2; }
        50% { opacity: 1; r: 3.5; }
      }
    </style>
  </defs>

